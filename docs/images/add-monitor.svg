<svg xmlns="http://www.w3.org/2000/svg" width="600" height="596" viewBox="0 0 600 596" font-family="Segoe UI, 'Segoe UI Variable', system-ui, -apple-system, Helvetica, Arial, sans-serif">
<defs><filter id="sh" x="-5%" y="-5%" width="110%" height="115%"><feGaussianBlur in="SourceAlpha" stdDeviation="9"/><feOffset dy="6" result="o"/><feComponentTransfer in="o" result="s"><feFuncA type="linear" slope="0.22"/></feComponentTransfer><feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge></filter><clipPath id="clip"><rect x="0" y="0" width="560" height="516" rx="8"/></clipPath></defs>
<g transform="translate(20,14)">
<rect width="560" height="556" rx="8" fill="#f3f3f3" stroke="#bdbdbd" filter="url(#sh)"/>
<path d="M8 0 H552 A8 8 0 0 1 560 8 V40 H0 V8 A8 8 0 0 1 8 0 Z" fill="#ffffff"/>
<line x1="0" y1="40" x2="560" y2="40" stroke="#d6d6d6"/>
<g transform="translate(14,12)"><rect width="16" height="16" rx="3" fill="#0067c0"/><path d="M3 9 L6 9 L8 4 L10 13 L12 8 L13 8" stroke="#fff" stroke-width="1.6" fill="none" stroke-linejoin="round"/></g>
<text x="40" y="25" font-size="12.5" fill="#1b1b1b" font-weight="normal" text-anchor="start" >Add monitor</text>
<g stroke="#1b1b1b" stroke-width="1.2"><line x1="524" y1="15" x2="534" y2="25"/><line x1="534" y1="15" x2="524" y2="25"/></g>
<g transform="translate(0,40)"><g clip-path="url(#clip)"><text x="18" y="36" font-size="12.5" fill="#1b1b1b" font-weight="normal" text-anchor="start" >Name:</text>
<rect x="190" y="18" width="350" height="26" rx="4" fill="#ffffff" stroke="#c8c8c8" /><text x="199" y="35.5" font-size="12.5" fill="#1b1b1b" font-weight="normal" text-anchor="start" >Customer portal</text>
<text x="18" y="72" font-size="12.5" fill="#1b1b1b" font-weight="normal" text-anchor="start" >Address:</text>
<rect x="190" y="54" width="350" height="26" rx="4" fill="#ffffff" stroke="#c8c8c8" /><text x="199" y="71.5" font-size="12.5" fill="#1b1b1b" font-weight="normal" text-anchor="start" >https://portal.example.com/health</text>
<text x="18" y="108" font-size="12.5" fill="#1b1b1b" font-weight="normal" text-anchor="start" >Check type:</text>
<rect x="190" y="90" width="200" height="26" rx="4" fill="#ffffff" stroke="#c0c0c0" /><text x="199" y="107.5" font-size="12.5" fill="#1b1b1b" font-weight="normal" text-anchor="start" >Auto (recommended)</text><path d="M370 101.0 l5 5 l5 -5" stroke="#6b6b6b" stroke-width="1.4" fill="none"/>
<text x="190" y="132" font-size="12" fill="#6b6b6b" font-weight="normal" text-anchor="start" >Will check using: HTTP</text>
<rect x="18" y="152" width="15" height="15" rx="3" fill="#fff" stroke="#8a8a8a"/><text x="41" y="164" font-size="12.5" fill="#1b1b1b" font-weight="normal" text-anchor="start" >Use global defaults for interval / timeout / failures</text>
<text x="18" y="198" font-size="12.5" fill="#1b1b1b" font-weight="normal" text-anchor="start" >Check every (seconds):</text>
<rect x="190" y="180" width="100" height="26" rx="4" fill="#ffffff" stroke="#c8c8c8" /><text x="199" y="197.5" font-size="12.5" fill="#1b1b1b" font-weight="normal" text-anchor="start" >30</text><g stroke="#6b6b6b" stroke-width="1.2" fill="none"><path d="M274 190 l4 -4 l4 4"/><path d="M274 196 l4 4 l4 -4"/></g>
<text x="18" y="234" font-size="12.5" fill="#1b1b1b" font-weight="normal" text-anchor="start" >Timeout (ms):</text>
<rect x="190" y="216" width="100" height="26" rx="4" fill="#ffffff" stroke="#c8c8c8" /><text x="199" y="233.5" font-size="12.5" fill="#1b1b1b" font-weight="normal" text-anchor="start" >5,000</text><g stroke="#6b6b6b" stroke-width="1.2" fill="none"><path d="M274 226 l4 -4 l4 4"/><path d="M274 232 l4 4 l4 -4"/></g>
<text x="18" y="270" font-size="12.5" fill="#1b1b1b" font-weight="normal" text-anchor="start" >Alert after N failures:</text>
<rect x="190" y="252" width="100" height="26" rx="4" fill="#ffffff" stroke="#c8c8c8" /><text x="199" y="269.5" font-size="12.5" fill="#1b1b1b" font-weight="normal" text-anchor="start" >3</text><g stroke="#6b6b6b" stroke-width="1.2" fill="none"><path d="M274 262 l4 -4 l4 4"/><path d="M274 268 l4 4 l4 -4"/></g>
<text x="18" y="306" font-size="12.5" fill="#1b1b1b" font-weight="normal" text-anchor="start" >TCP port:</text>
<rect x="190" y="288" width="100" height="26" rx="4" fill="#f6f6f6" stroke="#c8c8c8" /><text x="199" y="305.5" font-size="12.5" fill="#6b6b6b" font-weight="normal" text-anchor="start" >0</text><g stroke="#6b6b6b" stroke-width="1.2" fill="none"><path d="M274 298 l4 -4 l4 4"/><path d="M274 304 l4 4 l4 -4"/></g>
<text x="18" y="342" font-size="12.5" fill="#1b1b1b" font-weight="normal" text-anchor="start" >Expected HTTP status:</text>
<rect x="190" y="324" width="100" height="26" rx="4" fill="#ffffff" stroke="#c8c8c8" /><text x="199" y="341.5" font-size="12.5" fill="#1b1b1b" font-weight="normal" text-anchor="start" >200</text><g stroke="#6b6b6b" stroke-width="1.2" fill="none"><path d="M274 334 l4 -4 l4 4"/><path d="M274 340 l4 4 l4 -4"/></g>
<text x="18" y="378" font-size="12.5" fill="#1b1b1b" font-weight="normal" text-anchor="start" >Must contain text:</text>
<rect x="190" y="360" width="350" height="26" rx="4" fill="#ffffff" stroke="#c8c8c8" /><text x="199" y="377.5" font-size="12.5" fill="#1b1b1b" font-weight="normal" text-anchor="start" >&quot;status&quot;:&quot;ok&quot;</text>
<rect x="18" y="400" width="15" height="15" rx="3" fill="#0067c0"/><path d="M21.5 407.5 l3 3 l5 -6" stroke="#fff" stroke-width="1.8" fill="none"/><text x="41" y="412" font-size="12.5" fill="#1b1b1b" font-weight="normal" text-anchor="start" >Enabled</text>
<g><rect x="190" y="426" width="100" height="28" rx="4" fill="#fdfdfd" stroke="#c8c8c8" /><text x="240.0" y="444.5" font-size="12.5" fill="#1b1b1b" font-weight="normal" text-anchor="middle" >Test now</text></g>
<g><rect x="452" y="472" width="90" height="28" rx="4" fill="#fdfdfd" stroke="#c8c8c8" /><text x="497.0" y="490.5" font-size="12.5" fill="#1b1b1b" font-weight="normal" text-anchor="middle" >Cancel</text></g>
<g><rect x="354" y="472" width="90" height="28" rx="4" fill="#0067c0" stroke="#0067c0" /><text x="399.0" y="490.5" font-size="12.5" fill="#ffffff" font-weight="normal" text-anchor="middle" >OK</text></g></g></g>
</g></svg>